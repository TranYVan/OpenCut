$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'application'

tasks:
  dev:
    command: 'cargo run'
    deps: ['media:setup']
    options:
      runInCI: false

  check:
    command: 'cargo check'
    deps: ['media:setup']
    inputs:
      - 'src/**/*'
      - 'build.rs'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  # Unit tests; the thumbnail tests decode crates/media's fixtures.
  test:
    command: 'cargo test -p opencut-desktop'
    deps: ['media:setup']
    inputs:
      - 'src/**/*'
      - 'build.rs'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/media/tests/fixtures/**/*'

  build:
    command: 'cargo build --release'
    deps: ['media:setup']
    inputs:
      - 'src/**/*'
      - 'build.rs'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
    outputs:
      # Glob: the binary is opencut-desktop.exe on Windows.
      - '/target/release/opencut-desktop*'
