[package]
name = "opencut-desktop"
description = "OpenCut desktop app, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencut-desktop"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
gpui = { workspace = true }
# Same major as gpui's own, so thumbnails decode with what's already built.
image = "0.25"
opencut-compositor = { workspace = true, features = ["media"] }
opencut-editor = { workspace = true }
opencut-media = { workspace = true }
opencut-project-store = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

# Compile Metal shaders at runtime instead of in gpui's build.rs, so building
# only needs the Xcode Command Line Tools (no full Xcode / `metal` compiler).
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["runtime_shaders"] }
