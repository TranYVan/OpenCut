name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true

      # FFmpeg for crates/media: a prebuilt download, or a source build where
      # none is pinned (macOS), so worth keeping between runs.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/media/setup/**') }}

      - name: Run CI
        run: moon ci
