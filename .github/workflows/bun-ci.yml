name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish, so one failure shows all platform problems.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true

      # GPUI links X11/Wayland libraries on Linux; bindgen needs libclang;
      # mesa-vulkan-drivers gives the GPU-less runner lavapipe, a software
      # Vulkan adapter for the compositor's golden-image tests.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers libclang-dev
          # With lavapipe installed, a missing adapter is a bug, not a skip.
          echo "OPENCUT_REQUIRE_GPU=1" >> "$GITHUB_ENV"

      # FFmpeg for crates/media: a prebuilt download, or a source build where
      # none is pinned (macOS), so worth keeping between runs.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/media/setup/**') }}

      - name: Run CI
        run: moon ci
