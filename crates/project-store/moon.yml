$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'library'

fileGroups:
  sources:
    - 'src/**/*'
    - 'tests/**/*'
    - 'Cargo.toml'
    - '/Cargo.toml'
    - '/Cargo.lock'

tasks:
  check:
    command: 'cargo check -p opencut-project-store --all-targets'
    inputs:
      - '@group(sources)'

  test:
    command: 'cargo test -p opencut-project-store'
    inputs:
      - '@group(sources)'
