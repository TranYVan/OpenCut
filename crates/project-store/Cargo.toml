[package]
name = "opencut-project-store"
description = "OpenCut projects on disk: a folder per project with project.json and media"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "opencut_project_store"

[dependencies]
chrono = { workspace = true }
opencut-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Reads classic export zips (STORE entries; deflate for zips re-packed by hand).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
