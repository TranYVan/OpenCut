[workspace]
resolver = "3"
members = [
  'apps/desktop',
  # Listed one by one: crates/media holds only FFmpeg setup scripts so far.
  'crates/time',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

opencut-time = { path = "crates/time" }
