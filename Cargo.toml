[workspace]
resolver = "3"
members = [
  'apps/desktop',
  # Listed one by one: crates/media holds only FFmpeg setup scripts so far.
  'crates/time',
  'crates/model',
  'crates/editor',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

opencut-time = { path = "crates/time" }
opencut-model = { path = "crates/model" }
opencut-editor = { path = "crates/editor" }
