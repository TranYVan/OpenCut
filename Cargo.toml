[workspace]
resolver = "3"
members = [
  'apps/desktop',
  'crates/time',
  'crates/model',
  'crates/editor',
  'crates/media',
  'crates/gpu',
  'crates/compositor',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
wgpu = "29.0.1"

opencut-time = { path = "crates/time" }
opencut-model = { path = "crates/model" }
opencut-editor = { path = "crates/editor" }
opencut-media = { path = "crates/media" }
opencut-gpu = { path = "crates/gpu" }
opencut-compositor = { path = "crates/compositor" }
